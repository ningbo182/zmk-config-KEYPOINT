CONFIG_TRACKPOINT_EXPONENTIAL=y
# I2C enable
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_I2C_NRFX=y
CONFIG_LOG=n

# Trackpoint Sensitivity and Base Speed (decoupled from backlight, 130% consistent base speed, midpoint 12)
CONFIG_TRACKPOINT_MOUSE_BASE_SPEED_PERCENT=130
CONFIG_TRACKPOINT_MOUSE_SENS_BASE_PERCENT=100
CONFIG_TRACKPOINT_MOUSE_SENS_STEP_PERCENT=0
CONFIG_TRACKPOINT_SCURVE_MID=12
CONFIG_TRACKPOINT_MIN_MULT_PERCENT=35
CONFIG_TRACKPOINT_SMOOTH_ALPHA=65

# Scroll tuning (quadratic progressive curve: slow=22 for effortless start, fast=12 for speed)
CONFIG_TRACKPOINT_SCROLL_DIVISOR_SLOW=22
CONFIG_TRACKPOINT_SCROLL_DIVISOR_FAST=12
CONFIG_TRACKPOINT_SCROLL_INPUT_MAX=40
CONFIG_TRACKPOINT_SCROLL_DEADZONE=0

# Scroll direction inversion (non-natural scrolling)
CONFIG_TRACKPOINT_SCROLL_Y_DIR=-1
CONFIG_TRACKPOINT_SCROLL_X_DIR=-1