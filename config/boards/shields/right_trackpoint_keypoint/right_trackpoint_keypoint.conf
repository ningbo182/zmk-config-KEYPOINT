CONFIG_TRACKPOINT_EXPONENTIAL=y
# I2C enable
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_I2C_NRFX=y
CONFIG_LOG=y

# Trackpoint Sensitivity and Base Speed
CONFIG_TRACKPOINT_MOUSE_BASE_SPEED_PERCENT=105
CONFIG_TRACKPOINT_MOUSE_SENS_BASE_PERCENT=100

# Scroll tuning (sqrt curve — DIVISOR_SLOW is the fixed divisor)
CONFIG_TRACKPOINT_SCROLL_DIVISOR_SLOW=50
CONFIG_TRACKPOINT_SCROLL_DIVISOR_FAST=50
CONFIG_TRACKPOINT_SCROLL_INPUT_MAX=40
CONFIG_TRACKPOINT_SCROLL_DEADZONE=0

# Scroll direction inversion (non-natural scrolling)
CONFIG_TRACKPOINT_SCROLL_Y_DIR=-1
CONFIG_TRACKPOINT_SCROLL_X_DIR=-1