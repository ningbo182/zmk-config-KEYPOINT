# Enable split keyboard support for passing indicator state to peripherals	
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# Split Bluetooth responsiveness (7.5ms interval, low peripheral skip latency)
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=16


CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
